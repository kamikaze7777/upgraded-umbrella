org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Mod Properties
maven_group=meteordevelopment
# Only the output jar's filename, so this build and a stock meteor-client jar do not look alike in a
# mods folder. The mod id stays meteor-client - it is the resource namespace and the container lookup.
archives_base_name=meteor-client-lb
